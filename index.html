<style>

*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:#33433F;color:var(--paper);font-family:Onest,system-ui,sans-serif;font-size:16px;line-height:1.5;display:flex;flex-direction:column;justify-content:center;padding:96px var(--field)}

.card img{width:96px;height:88px;border-radius:12px;object-fit:cover}
.card b{display:block;font-weight:600}
.card span{color:var(--mist)}
.note{margin-top:48px;font-size:13px;color:var(--muted)}
.note a{color:var(--paper)}
